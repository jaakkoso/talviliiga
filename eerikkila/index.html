<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Huuhkajaliiga · SJK P2015</title>
<meta name="description" content="SJK P2015 Huuhkajaliigassa Eerikkilässä: otteluohjelma ja tulokset.">
<meta name="theme-color" content="#211e1e">
<meta name="color-scheme" content="only light">
<link rel="icon" href="../assets/logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css?v=20261101l">
</head>
<body>
<header class="top">
  <div class="top-in">
    <img src="../assets/logo-180.png" alt="SJK-juniorit" width="52" height="52">
    <div class="t">
      <h1>Huuhkajaliiga</h1>
      <div class="sub">Eerikkilän Urheiluopisto, Tammela</div>
    </div>
  </div>
</header>
<nav class="menu" aria-label="Osiot"><div class="menu-in"><a href="../">Etusivu</a><a href="../turnaukset/">Turnaukset</a><a href="../eerikkila/" aria-current="page">Huuhkajaliiga</a><a href="../piirisarja/">Piirisarjat</a><a href="../kuva/">Ota somekuva</a></div></nav>
<script>(function(){var a=document.querySelector(".menu [aria-current]");if(a&&a.offsetLeft+a.offsetWidth>a.parentNode.clientWidth)a.parentNode.scrollLeft=a.offsetLeft-12;})();</script>
<main class="wrap">
  <nav class="tabs" id="tabs" aria-label="Tapahtuma"></nav>
  <div class="sec" id="view"><p class="note">Ladataan…</p></div>
</main>
<footer>Tulokset kirjataan Palloliiton tulospalveluun ottelun aikana. Sivustolla ei ole pelaajien nimiä.</footer>
<script src="../assets/matches.js?v=20261101i"></script>
<script>
(async () => {
  const view = document.getElementById('view'), tabs = document.getElementById('tabs');
  let data;
  try { data = await P15.load('data.json'); }
  catch (e) { view.innerHTML = '<p class="note">Tietoja ei saatu ladattua. Tarkista verkkoyhteys ja päivitä sivu.</p>'; return; }
  tabs.innerHTML = data.events.map(ev => `<button type="button" id="tab-${ev.id}" data-id="${ev.id}" aria-pressed="false">${P15.esc(ev.name)}</button>`).join('');
  // Lohkon kaikki ottelut, myös muiden joukkueiden keskinäiset (avautuu napista)
  const WD = ['su', 'ma', 'ti', 'ke', 'to', 'pe', 'la'];
  function lohkoHTML(ev) {
    if (!ev.lohko || !ev.lohko.length) return '';
    const auki = P15.store.get('lohko-auki', '0') === '1';
    const lista = [...ev.lohko].sort((a, b) => a.date.localeCompare(b.date) || (a.time || '99').localeCompare(b.time || '99'));
    const paivat = [...new Set(lista.map(m => m.date))];
    const rivi = m => {
      const oma = P15.isOwn(m.home) || P15.isOwn(m.away);
      const tulos = m.score ? m.score.map(([h, a]) => `${h}–${a}`).join('<br>') : '<span class="aika">–</span>';
      return `<li class="${oma ? 'oma' : ''}"><span class="lk-t">${P15.esc(m.time || '')}</span><span class="lk-h ${P15.isOwn(m.home) ? 'me' : ''}">${P15.esc(m.home)}</span><span class="lk-s">${tulos}</span><span class="lk-a ${P15.isOwn(m.away) ? 'me' : ''}">${P15.esc(m.away)}</span></li>`;
    };
    return `<div class="lohko"><button type="button" class="btn lohko-btn" data-lohko aria-expanded="${auki}">${auki ? 'Piilota' : 'Näytä'} lohkon kaikki ottelut (${ev.lohko.length})</button>
      <div class="lohko-list" ${auki ? '' : 'hidden'}>${paivat.map(d => { const p = P15.parseDate(d); return `<h3>${WD[p.getDay()]} ${p.getDate()}.${p.getMonth() + 1}.</h3><ol>${lista.filter(m => m.date === d).map(rivi).join('')}</ol>`; }).join('')}
      <p class="note">Tuplapelit: ylempi tulos 1. peli, alempi 2. peli. Tulokset Palloliiton tulospalvelusta, päivittyy 15 min välein.</p></div></div>`;
  }
  function render(id) {
    tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === id));
    const ev = data.events.find(e => e.id === id);
    const played = ev.matches.some(m => m.score);
    const upcoming = ev.matches.every(m => !m.score);
    const tday = (() => { const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0'); })();
    const liveNyt = ev.matches.some(m => m.live), pelipaivaNyt = ev.matches.some(m => m.date === tday);
    const viim = ev.matches.map(m => m.live).filter(Boolean).sort().pop();
    const paivita = pelipaivaNyt ? `<div class="refresh-row">${liveNyt ? '<span class="now-tag"><i class="live-dot"></i>Ottelu käynnissä</span>' : ''}<button type="button" class="btn refresh" data-refresh><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>Päivitä tilanne</button><small>${viim ? 'Tilanne haettu klo ' + P15.esc(viim) : 'Päivittyy itsestään minuutin välein'}</small></div>` : '';
    view.innerHTML = `<div class="summary">
        <div class="sec-head"><h2>${P15.esc(ev.title)}</h2><span class="btns">${ev.taso ? `<a class="btn" href="${ev.taso}" target="_blank" rel="noopener">Live Palloliitossa ↗</a>` : ''}<a class="btn" href="https://live.veo.co/web-app/clubs/sjk-juniorit-ry-2/teams/sjk-p2015/" target="_blank" rel="noopener">▶ Veo-kanava ↗</a></span></div>
        ${paivita}
        <div class="lvl">${P15.esc(ev.dates)} · ${P15.esc(ev.team)} · ${P15.esc(ev.format)}</div>
        ${played ? P15.summaryHTML(P15.summary(ev.matches, ev.team)) : `<p class="note">Kotijoukkue kirjaa tulokset Palloliiton tulospalveluun ottelun aikana. Seuraa live-tuloksia yllä olevasta linkistä.</p>`}
      </div>` + P15.tableHTML(ev.table) + lohkoHTML(ev) + P15.listHTML(ev.matches.map(m => ({ m, opt: { own: ev.team, showSeries: false } })), true);
    P15.store.set('eerikkila-tab', id);
  }
  tabs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) render(b.dataset.id); });
  let start = P15.store.get('eerikkila-tab', data.events[0].id);
  if (!data.events.some(e => e.id === start)) start = data.events[0].id;
  render(start);
  // Pelipäivänä tilanne päivittyy itsestään minuutin välein (sivua ei tarvitse ladata uudelleen)
  const tanaan = () => { const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0'); };
  const pelipaiva = () => data.events.some(ev => ev.matches.some(m => m.live || m.date === tanaan()));
  async function hae() {
    try { const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) { data = await r.json(); render(tabs.querySelector('[aria-pressed="true"]')?.dataset.id || start); } } catch (e) {}
  }
  setInterval(() => { if (pelipaiva() && !document.hidden) hae(); }, 60000);
  view.addEventListener('click', e => { const b = e.target.closest('[data-lohko]'); if (!b) return; const auki = b.getAttribute('aria-expanded') !== 'true'; P15.store.set('lohko-auki', auki ? '1' : '0'); b.setAttribute('aria-expanded', auki); b.textContent = b.textContent.replace(/^(Näytä|Piilota)/, auki ? 'Piilota' : 'Näytä'); b.nextElementSibling.hidden = !auki; });
  view.addEventListener('click', async e => { const b = e.target.closest('[data-refresh]'); if (!b) return; b.classList.add('pyorii'); b.disabled = true; await hae(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && pelipaiva()) hae(); });
})();
</script>
<script src="../assets/takaisin.js?v=20261101a"></script>
</body>
</html>
