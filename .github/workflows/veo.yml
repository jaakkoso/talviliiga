# Veo-videolinkit: tarkistaa joukkueen Veo-kanavan 15 min välein ja liittää uuden tallenteen otteluun heti kun se ilmestyy.
# Kevyt ajo ilman selainta; koskee vain viiden viime päivän otteluita, joilta linkki puuttuu.
name: Veo-videolinkit

on:
  schedule:
    - cron: "7,22,37,52 5-21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: paivita-tulokset
  cancel-in-progress: false

jobs:
  veo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tarkista Veo-kanava
        working-directory: scripts/paivitys
        env:
          PAIVITA: veo
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-audit --no-fund --silent
          node paivita.mjs
      - name: Julkaise uudet linkit
        run: |
          rm -f scripts/paivitys/varoitukset.txt
          git diff --quiet -- piirisarja eerikkila turnaukset && { echo "Ei uusia videoita."; exit 0; }
          git config user.name "Tulospäivitys"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piirisarja/data.json eerikkila/data.json turnaukset/data.json
          git commit -m "Veo-video liitetty otteluun $(TZ=Europe/Helsinki date '+%-d.%-m.%Y klo %H.%M')"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs origin main || { git rebase --abort; git pull --rebase origin main; }; sleep 5; done
          # Julkaisu: Actions-julkaisu (julkaise.yml) tai vanha Pagesin oma julkaisu
          gh workflow run julkaise.yml --ref main >/dev/null 2>&1 || true
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || true
        env:
          GH_TOKEN: ${{ github.token }}
