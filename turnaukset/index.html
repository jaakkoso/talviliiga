<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turnaukset · SJK P2015</title>
<meta name="description" content="SJK P2015 -joukkueen talven turnaukset ja niiden tulokset.">
<meta name="theme-color" content="#211e1e">
<meta name="color-scheme" content="only light">
<link rel="icon" href="../assets/logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css?v=20261106c">
</head>
<body>
<header class="top">
  <div class="top-in">
    <img src="../assets/logo-180.png" alt="SJK-juniorit" width="52" height="52">
    <div class="t">
      <h1>Turnaukset</h1>
      <div class="sub">Kausi 2026</div>
    </div>
  </div>
</header>
<nav class="menu" aria-label="Osiot"><div class="menu-in"><a href="../">Koti</a><a href="../turnaukset/" aria-current="page">Turnaukset</a><a href="../eerikkila/">Huuhkajaliiga</a><a href="../piirisarja/">Sarjat</a><a href="../kuva/">Somekuva</a></div></nav>
<script>(function(){var a=document.querySelector(".menu [aria-current]");if(a&&a.offsetLeft+a.offsetWidth>a.parentNode.clientWidth)a.parentNode.scrollLeft=a.offsetLeft-12;})();</script>
<main class="wrap" id="view"><p class="note">Ladataan…</p></main>
<footer>Sivustolla ei ole pelaajien nimiä, evästeitä eikä seurantaa.</footer>
<script src="../assets/matches.js?v=20261107b"></script>
<script>
(async () => {
  const view = document.getElementById('view');
  let data;
  try { data = await P15.load('data.json'); }
  catch (e) { view.innerHTML = '<p class="note">Tietoja ei saatu ladattua. Tarkista verkkoyhteys ja päivitä sivu.</p>'; return; }
  const CUP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';
  const tday = () => { const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0'); };
  const first = ev => ev.teams.flatMap(t => t.matches).map(m => m.date).sort()[0] || '';
  const isUp = ev => ev.teams.every(t => t.matches.every(m => !m.score));
  const isToday = ev => ev.teams.some(t => t.matches.some(m => m.date === tday()));
  const teamHTML = (ev, t) => {
    const s = P15.summary(t.matches, t.name);
    const pl = t.place, top = pl && pl.pos <= 3;
    const badge = pl ? `<span class="medal${top ? '' : ' plain'}">${top ? CUP : ''}${pl.pos}. / ${pl.of}</span>` : '';
    return `<div class="eteam">
      <div class="eteam-head"><b>${P15.esc(t.level)}</b>${badge}</div>
      <div class="rec"><span>${P15.esc(t.name)}</span>${s.p ? `<span><b>${s.w}–${s.d}–${s.l}</b> V–T–H</span><span>maalit <b>${s.gf}–${s.ga}</b></span>` : ''}</div>
      ${[...t.matches].sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '')).map(m => P15.matchHTML({ ...m, series: `${ev.name} · ${t.level}` }, { own: t.name, showSeries: false, link: ev.link })).join('')}
    </div>`;
  };
  // Lohkojen sarjataulukot: joukkuetta painamalla aukeavat sen kaikki ottelut
  const groupsHTML = (ev, ei) => (ev.groups || []).length ? `<div class="event-tables">${ev.groups.map((g, gi) => `<div data-group="${ei}:${gi}">${P15.tableHTML({ name: g.name, url: ev.link, urlLabel: 'Turnauksen sivu', rows: g.rows }, { teamClick: !!(g.matches && g.matches.length), lyhyt: true })}</div>`).join('')}<p class="note">Paina joukkuetta, niin näet sen kaikki ottelut. Tulokset turnauksen tulospalvelusta.</p></div>` : '';
  const evHTML = (ev, ei) => `<section class="event">
      <div class="event-head"><div><h2>${P15.esc(ev.name)}</h2><div class="lvl">${P15.esc(ev.dates)} · ${P15.esc(ev.venue)}${ev.host ? ' · oma turnaus' : ''}</div></div>
      ${ev.link ? `<a class="btn" href="${ev.link}"${ev.host ? '' : ' target="_blank" rel="noopener"'}>${ev.host ? 'Turnauksen tulospalvelu →' : 'Turnauksen sivu ↗'}</a>` : ''}</div>
      ${isToday(ev) ? `<div class="refresh-row"><span class="now-tag"><i class="live-dot"></i>Käynnissä</span><button type="button" class="btn refresh" data-refresh><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>Päivitä tulokset</button><small>Päivittyy itsestään minuutin välein</small></div>` : ''}
      <div class="event-teams">${ev.teams.map(t => teamHTML(ev, t)).join('')}</div>
      ${groupsHTML(ev, ei)}
    </section>`;
  function render() {
    const evs = data.events.map((e, i) => ({ e, i }));
    const up = evs.filter(x => isUp(x.e) || isToday(x.e)).sort((a, b) => first(a.e).localeCompare(first(b.e)));
    const past = evs.filter(x => !isUp(x.e) && !isToday(x.e)).sort((a, b) => first(b.e).localeCompare(first(a.e)));
    view.innerHTML = (up.length ? `<h2 class="eyebrow-h">Tulevat ja käynnissä</h2>` + up.map(x => evHTML(x.e, x.i)).join('') : '')
      + (past.length ? `<h2 class="past-title">Menneet turnaukset</h2>` + past.map(x => evHTML(x.e, x.i)).join('') : '');
  }
  render();
  async function hae() { try { const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) { data = await r.json(); render(); } } catch (e) {} }
  const pelipaiva = () => data.events.some(isToday);
  setInterval(() => { if (pelipaiva() && !document.hidden) hae(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && pelipaiva()) hae(); });
  const avaa = r => { const [ei, gi] = r.closest('[data-group]').dataset.group.split(':').map(Number); const ev = data.events[ei]; P15.teamDialog(r.dataset.team, ev.groups[gi].matches, `${ev.name} · ${ev.groups[gi].name}. Tulos joukkueen näkökulmasta, sen omat maalit ensin.`); };
  view.addEventListener('click', async e => {
    const r = e.target.closest('tr[data-team]'); if (r) { avaa(r); return; }
    const b = e.target.closest('[data-refresh]'); if (b) { b.classList.add('pyorii'); b.disabled = true; await hae(); }
  });
  view.addEventListener('keydown', e => { const r = e.target.closest('tr[data-team]'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); avaa(r); } });
})();
</script>
<script src="../assets/takaisin.js?v=20261107a"></script>
</body>
</html>
