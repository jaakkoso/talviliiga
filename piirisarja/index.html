<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piirisarjat · SJK P2015</title>
<meta name="description" content="SJK P2015 -joukkueiden piirisarjojen tulokset kaikilla tasoilla.">
<meta name="theme-color" content="#211e1e">
<meta name="color-scheme" content="only light">
<link rel="icon" href="../assets/logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css?v=20261118a">
</head>
<body>
<header class="top">
  <div class="top-in">
    <img src="../assets/logo-180.png" alt="SJK-juniorit" width="52" height="52">
    <div class="t">
      <h1>Piirisarjat</h1>
      <div class="sub" id="sub">Kausi 2026</div>
    </div>
  </div>
</header>
<nav class="menu" aria-label="Osiot"><div class="menu-in"><a href="../">Koti</a><a href="../turnaukset/">Turnaukset</a><a href="../eerikkila/">Huuhkajaliiga</a><a href="../piirisarja/" aria-current="page">Sarjat</a><a href="../kuva/">Somekuva</a></div></nav>
<script>(function(){var a=document.querySelector(".menu [aria-current]");if(a&&a.offsetLeft+a.offsetWidth>a.parentNode.clientWidth)a.parentNode.scrollLeft=a.offsetLeft-12;})();</script>
<main class="wrap">
  <nav class="tabs" id="tabs" aria-label="Sarjataso"></nav>
  <div class="sec" id="view"><p class="note">Ladataan tuloksia…</p></div>
</main>
<footer id="foot">Lähde: Palloliiton tulospalvelu.</footer>
<script src="../assets/matches.js?v=20261117b"></script>
<script>
(async () => {
  const view = document.getElementById('view'), tabs = document.getElementById('tabs');
  let data;
  try { data = await P15.load('data.json'); }
  catch (e) { view.innerHTML = '<p class="note">Tuloksia ei saatu ladattua. Tarkista verkkoyhteys ja päivitä sivu.</p>'; return; }
  const short = n => n.replace('SJK-j/', '').replace(/\s*-15$/, '');
  const lvl = t => t.level.split('·')[0].replace(/\s*\(.*?\)/, '').trim();
  const K = data.karsinta && data.karsinta.groups && data.karsinta.groups.length ? data.karsinta : null;
  document.getElementById('foot').textContent = `Lähde: ${data.source}, päivitetty ${data.updated.split('-').reverse().map(Number).join('.')}. Sivustolla ei ole pelaajien nimiä.`;
  // Välilehdet: karsinta (kultainen) ensin, sitten kauden 2026 arkisto
  const ark = [{ id: 'kaikki', label: 'Kaikki' }, ...data.teams.map(t => ({ id: t.id, label: lvl(t) }))];
  // Ylhäällä kaudet (uusin ensin), alla kauden sarjat; 2027:ssä karsinta (kultainen)
  // Ylhäällä kaudet (uusin ensin); kauden sisällä sarjat alavälilehtinä. Karsinta kultaisena.
  tabs.innerHTML = (K ? `<button type="button" class="kulta-tab" data-id="karsinta" aria-pressed="false">${P15.esc(K.season)}</button>` : '')
    + `<button type="button" data-id="arkisto" aria-pressed="false">${P15.esc(data.season)}</button>`;
  const ord = m => (m.date || '9999') + (m.time || '99');
  function karsintaHTML() {
    return `<nav class="tabs subtabs" aria-label="Kauden ${P15.esc(K.season)} sarjat"><button type="button" aria-pressed="true">${P15.esc(K.name)}</button></nav>`
      + `<p class="kars-intro">Mukana kulta ja musta · <a href="${K.url}" target="_blank" rel="noopener">Palloliitto ↗</a></p>`
      + K.groups.map(g => {
        const omat = g.matches.filter(m => m.home === g.team || m.away === g.team).sort((a, b) => ord(a).localeCompare(ord(b)));
        const muut = g.matches.filter(m => !omat.includes(m)).sort((a, b) => ord(a).localeCompare(ord(b)));
        const avoimet = omat.filter(m => !m.date).length;
        return `<div class="sec-head" style="margin-top:18px"><h2>${P15.esc(g.name)} · ${P15.esc(short(g.team))}</h2></div>`
          + P15.tableHTML({ name: 'Sarjataulukko', url: g.url, rows: g.rows }, { teamClick: true, ryhma: g.name })
          + `<h3 class="kars-h">Ottelut · ${P15.esc(short(g.team))}</h3>`
          + omat.map(m => P15.matchHTML(m, { own: g.team, showSeries: false })).join('')
          + (avoimet ? `<p class="note">Pelipäiviä ei ole vielä sovittu (${avoimet} ottelua). Päivä, aika ja tulokset päivittyvät tähän automaattisesti, kun ne julkaistaan.</p>` : '')
          + (muut.length ? `<details class="kars-muut"><summary>Lohkon muut ottelut (${muut.length})</summary>${muut.map(m => P15.matchHTML(m, { own: g.team, showSeries: false })).join('')}</details>` : '');
      }).join('');
  }
  let arkTab = P15.store.get('piirisarja-tab', 'kaikki');
  if (!ark.some(o => o.id === arkTab)) arkTab = 'kaikki';
  function arkistoHTML() {
    const sub = `<nav class="tabs subtabs" aria-label="Kauden ${P15.esc(data.season)} sarjat">${ark.map(o => `<button type="button" data-sub="${o.id}" aria-pressed="${o.id === arkTab}">${P15.esc(o.label)}</button>`).join('')}</nav>`;
    if (arkTab === 'kaikki') {
      const items = data.teams.flatMap(t => t.matches.map(m => ({ m, opt: { own: t.name, showSeries: true } })));
      return sub + `<p class="note">Kauden ${P15.esc(data.season)} sarjaottelut, uusin ensin. Valitse sarjataso nähdäksesi sen yhteenvedon ja taulukot.</p>` + P15.listHTML(items);
    }
    const t = data.teams.find(t => t.id === arkTab);
    return sub + `<div class="summary"><div class="sec-head"><h2>${P15.esc(lvl(t))}</h2><a class="btn" href="${t.taso}" target="_blank" rel="noopener">Palloliiton sivu ↗</a></div>
      <div class="lvl">${P15.esc(t.level)} · ${P15.esc(t.name)}</div>${P15.summaryHTML(P15.summary(t.matches, t.name))}</div>`
      + (t.tables && t.tables.length ? `<div class="tables">${t.tables.map(x => P15.tableHTML(x)).join('')}</div>` : `<p class="note">${P15.esc(data.noTables || '')}</p>`)
      + P15.listHTML(t.matches.map(m => ({ m, opt: { own: t.name } })));
  }
  let paa;
  function render(id) {
    paa = id;
    tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === id));
    document.getElementById('sub').textContent = id === 'karsinta' ? `Kausi ${K.season} · ${K.name}` : `Kausi ${data.season} · ${data.teams.length} sarjatasoa`;
    view.innerHTML = id === 'karsinta' ? karsintaHTML() : arkistoHTML();
    P15.store.set('piirisarja-paa', id);
  }
  tabs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) render(b.dataset.id); });
  view.addEventListener('click', e => {
    const s = e.target.closest('button[data-sub]'); if (s) { arkTab = s.dataset.sub; P15.store.set('piirisarja-tab', arkTab); render('arkisto'); return; }
    const r = e.target.closest('tr[data-team]');
    if (r && paa === 'karsinta') { const g = K.groups.find(g => g.rows.some(x => x.team === r.dataset.team)); if (g) P15.teamDialog(r.dataset.team, g.matches, 'Tulos joukkueen näkökulmasta. Pelipäivät päivittyvät, kun ne sovitaan.'); }
  });
  let alku = P15.store.get('piirisarja-paa', K ? 'karsinta' : 'arkisto');
  if (alku === 'karsinta' && !K) alku = 'arkisto';
  render(K ? 'karsinta' : alku);
})();
</script>
<script src="../assets/takaisin.js?v=20261107a"></script>
</body>
</html>
